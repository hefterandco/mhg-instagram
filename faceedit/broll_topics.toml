# B-roll for My House Guardian: what you say -> what cuts away on screen.
#
# The principle: B-roll shows what My House Guardian takes off the homeowner's
# plate, in a warm, real, Fairfield way. We're the neighbor with a key, not a
# vendor or a security company. Three kinds, in priority order (first match wins):
#
#   service  the work, done for them: house manager, to-do visits, partner
#            bundles, the house record. YOUR OWN footage only. Stock can't show
#            our service honestly, so "stock" is [] for these.
#   life     the homeowner's time back: family moments. Stock allowed.
#   place    season and setting, as texture: foliage, snowfall, lights. Stock
#            allowed, but never stock houses or streets (Pixabay's "colonial
#            house" is Mexico); Fairfield homes come from your own footage.
#
# Never: disasters as a scare (floods, fires, burst pipes), shields/locks/alarms,
# a worker doing licensed trade work (implies "we do it", CGS 20-334), senior
# care, house numbers or street signs, brands. [broll] avoid_tags in
# faceedit.toml drops stock clips tagged with any of these.
#
# Fields: say = trigger words/phrases. search = words matched against YOUR clip
# file names in ~/Movies/MHG-broll (name files with these words). stock = short
# Pixabay searches; a clip is used only if its tags contain every word of one.
# allow = tags this topic may use even though avoid_tags blocks them.
# For a one-off video, use `faceedit broll <plan>` to swap or drop picks.

# ---------------------------------------------------------------- service

[[topic]]
kind = "service"
say = ["house manager", "one call", "one-call", "handle it all", "handle-it-all", "one number", "call us", "give us a call"]
search = "house manager phone call"
stock = []

