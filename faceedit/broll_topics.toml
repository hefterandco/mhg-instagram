# What you say -> what B-roll to look for. When a word or phrase in "say" is
# spoken, a cutaway matching "search" is pulled (from your own clips folder if
# set, otherwise Pexels free stock). Add topics freely; first match wins.
# For a one-off video, edit the "broll" list in its .plan.json instead.
# "stock" = short Pixabay searches; a clip is only used if its tags contain every
# word of one of them. [] = your own clips only (Pixabay has nothing relevant).

