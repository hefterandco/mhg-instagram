# B-roll for My House Guardian: what you say -> what cuts away on screen.
#
# Every cutaway is maintenance or construction work around the home: the
# preventative care list, the partner bundles, to-do visits and projects. Nothing
# else (no family, scenery or seasons).
#
# Sources, in order:
#   1. YOUR clips in ~/Movies/MHG-broll whose file names share words with "search".
#      These sell the service; film them (the review sheet lists what's missing).
#   2. "stock": Pixabay searches specific to the topic (a clip must be tagged with
#      every word of one).
#   3. If neither, the vetted general home-work pool, [broll] general_stock in
#      faceedit.toml (screwdriver, hammer, carpentry, paint roller...). Pixabay has
#      no footage of spigots, filters, detectors, sump pumps or weatherstripping,
#      so those moments show general house work until you film the real thing.
#
# Never shown: licensed trade work as if we do it (wiring, gas, refrigerant,
# plumbing repairs), scare/disaster, security imagery, brands (avoid_tags).
# Topics higher in the file win when one sentence matches several.

