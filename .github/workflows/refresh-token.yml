name: Refresh Instagram token

on:
  schedule:
    # Mondays 8:13 UTC. The token lasts 60 days; refreshing weekly keeps it far from expiring.
    - cron: "13 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh and save token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python poster/refresh_token.py
