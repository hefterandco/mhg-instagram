name: Collect Instagram insights

on:
  schedule:
    # Four times a day, so every Story is read before Meta deletes its numbers at 24 hours.
    # 03:41, 09:41, 15:41, 21:41 UTC = 10:41pm, 4:41am, 10:41am, 4:41pm Connecticut (EST).
    - cron: "41 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Read numbers from Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION }}
        run: python poster/insights.py

      - name: Save numbers
        run: |
          if [ -n "$(git status --porcelain insights)" ]; then
            git config user.name "mhg-poster"
            git config user.email "mhg-poster@users.noreply.github.com"
            git add insights
            git commit -m "Record Instagram insights [skip ci]"
            # The poster commits to queue/ and stories/ on its own schedule; take those in first.
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "Push failed (attempt $i), retrying..."
              sleep $((i * 5))
            done
            echo "::error::Could not save insights. The next run will collect them again."
            exit 1
          fi
