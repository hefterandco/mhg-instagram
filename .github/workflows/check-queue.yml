name: Check queue

on:
  push:
    paths: ["queue/**", "poster/**"]
  pull_request:
    paths: ["queue/**", "poster/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python poster/queue_check.py
